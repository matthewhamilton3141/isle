<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Isle Setup</title>
  <link rel="stylesheet" href="../shared/panel.css">
  <style>
    #root { display: flex; flex-direction: column; height: 100%; padding: 32px; }
    .cards { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .details { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .detail { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 17px; color: rgba(255,255,255,0.75); }
    .detail::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.4); margin-top: 6px; flex: none; }
    .status { display: flex; align-items: center; gap: 6px; margin-top: 20px; font-weight: 600; font-size: 13px; }
    .status svg { width: 16px; height: 16px; }
    .status.warn { font-weight: 400; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="onboarding.js"></script>
</body>
</html>
