<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Isle Settings</title>
  <link rel="stylesheet" href="../shared/panel.css">
  <style>
    #root { display: flex; height: 100%; }
    .sidebar { width: 185px; flex: none; padding: 18px 10px; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 2px; }
    .sidebar h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-40); margin: 12px 10px 4px; }
    .sidebar h2:first-child { margin-top: 0; }
    .nav { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--fg-70); padding: 6px 10px; border-radius: 7px; font-size: 13px; }
    .nav svg { width: 14px; height: 14px; }
    .nav.active { background: var(--fg-12); color: var(--fg); }
    .nav:hover:not(.active) { background: var(--fg-05); }
    .detail-pane { flex: 1; min-width: 0; padding: 24px 28px; overflow: auto; }
    .detail-pane h1 { font-size: 20px; margin-bottom: 18px; }
    .section { background: var(--fg-05); border-radius: 12px; padding: 6px 16px; margin-bottom: 16px; }
    .section > .row, .section > .stack { padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .section > :last-child { border-bottom: 0; }
    .section .stack .row { min-height: 24px; }
    .hook-status { display: flex; align-items: center; gap: 6px; }
    .hook-status svg { width: 15px; height: 15px; }
  </style>
</head>
<body>
  <div id="root">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="detail-pane" id="detail"></main>
  </div>
  <script type="module" src="settings.js"></script>
</body>
</html>
