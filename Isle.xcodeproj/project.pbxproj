			name = "Copy MediaRemoteAdapter";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The adapter lives in Vendor/, deliberately OUTSIDE the Isle/ synchronized\n# group. If a .framework sits inside that group Xcode auto-links it, and the\n# app then refuses to launch with a dyld error because nothing embedded it.\n# Isle must not link this framework at all -- it only ever hands the path to\n# /usr/bin/perl, which dlopens it out-of-process.\n#\n# Everything lands in Resources/ together, because the Swift side derives the\n# framework path from the .pl's URL. -a preserves the Versions/Current\n# symlinks and the ad-hoc signature.\n\nset -e\n\nSRC=\"$SRCROOT/Vendor/mediaremote-adapter\"\nDST=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources\"\n\nif [ ! -d \"$SRC/MediaRemoteAdapter.framework\" ]; then\n  echo \"warning: MediaRemoteAdapter.framework missing - run ./scripts/build-mediaremote-adapter.sh (now-playing will not work)\"\n  exit 0\nfi\n\nmkdir -p \"$DST\"\nrsync -a \"$SRC/MediaRemoteAdapter.framework\" \"$DST/\"\nrsync -a \"$SRC/mediaremote-adapter.pl\" \"$SRC/mediaremote-adapter-LICENSE.txt\" \"$DST/\"\n";
		};
/* End PBXShellScriptBuildPhase section */

